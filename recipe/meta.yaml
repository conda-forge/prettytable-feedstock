{% set name = "prettytable" %}
{% set version = "3.19.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0ecedd6d9a560b330503bef15791b77954fa46b7123203d91e463330b61959ba

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling >=1.27
    - hatch-vcs
  run:
    - python >={{ python_min }}
    - wcwidth >=0.3.5
  run_constrained:
    - ptable >=9999

test:
  imports:
    - prettytable
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/prettytable/prettytable
  license_file: LICENSE
  license: BSD-3-Clause
  summary: A simple Python library for easily displaying tabular data in a visually appealing ASCII table format

extra:
  recipe-maintainers:
    - anguslees
    - licode
    - ericpre
